# Image: publishes ghcr.io/open-southeners/lambdary for linux/amd64 and
# linux/arm64 whenever a release tag is pushed. Tags have no "v" prefix, so the
# image tag is the same as the git tag, plus `latest` for a non-prerelease.
name: Image

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to commit SHAs: this job holds a token that can publish the image.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pick tags
        id: tags
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          tags="ghcr.io/open-southeners/lambdary:${VERSION}"
          if [[ "${VERSION}" != *-* ]]; then
            tags="${tags},ghcr.io/open-southeners/lambdary:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
