# Release
#
# Trigger: pushing a tag matching [0-9]+.[0-9]+.[0-9]+ or
#   [0-9]+.[0-9]+.[0-9]+-<pre-release> (e.g. 1.2.3, 1.2.3-rc.1).
#
# Steps:
#   1. release   - derive the version from the tag, require a matching
#                  `## [X.Y.Z]` section in CHANGELOG.md (release-flow/
#                  keep-a-changelog-action, command: query), and create the
#                  GitHub release with that section as its body.
#   2. binaries  - cross-compile linux/darwin, amd64+arm64 binaries, package
#                  each as a tar.gz with README.md and CHANGELOG.md, generate
#                  checksums.txt, and upload everything to the release
#                  created above.
#
# A release REQUIRES a `## [X.Y.Z]` section in CHANGELOG.md for the tagged
# version, or the release job fails before anything is built or published —
# see CONTRIBUTING.md's "Release Process" section before tagging.
#
# Retry semantics: safe to re-run after a partial failure. softprops/
# action-gh-release matches on tag_name and updates the existing release
# instead of creating a duplicate, and re-uploaded assets with the same
# filename replace the previous ones — so re-running this workflow (or just
# the `binaries` job) after e.g. a network blip during asset upload picks up
# where it left off without any manual cleanup.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Query changelog section
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: ${{ steps.version.outputs.version }}

      - name: No changelog section for this version
        if: failure()
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::error::CHANGELOG.md has no [${VERSION}] section for this tag — see CONTRIBUTING.md's Release Process section"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.release-notes }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  binaries:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package binaries
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          # internal/rie/rie.go's Version const is the single source of
          # truth for the upstream RIE tag embedded below — see the WARNING
          # comment next to that const for why this grep must keep matching
          # its exact declaration form.
          RIE_VERSION="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/rie/rie.go)"
          if [ -z "${RIE_VERSION}" ]; then
            echo "::error::could not extract rie.Version from internal/rie/rie.go — grep pattern out of sync?"
            exit 1
          fi

          rie_src="$(mktemp -d)"
          git clone --depth 1 --branch "${RIE_VERSION}" \
            https://github.com/aws/aws-lambda-runtime-interface-emulator "${rie_src}"

          embedded_path="internal/rie/embedded/aws-lambda-rie"

          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            outdir="dist/${GOOS}_${GOARCH}"
            mkdir -p "${outdir}"

            # Rebuild the embedded RIE payload fresh for this target and
            # remove any prior target's copy first, so a stale binary for
            # the wrong GOOS/GOARCH can never leak into this build.
            rm -f "${embedded_path}"
            (cd "${rie_src}" && CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" GOTOOLCHAIN=auto \
              go build -o "${GITHUB_WORKSPACE}/${embedded_path}" ./cmd/aws-lambda-rie)

            if [ ! -s "${embedded_path}" ]; then
              echo "::error::${embedded_path} missing or empty after building RIE for ${GOOS}/${GOARCH}"
              exit 1
            fi

            # Native-only cross-check that the embed actually happened:
            # runs against the just-built embedded_path, so it must happen
            # before the loop moves on and rebuilds it for the next target.
            # This is the linux/amd64 iteration on this ubuntu-latest
            # runner, so the compiled test binary itself is runnable here.
            if [ "${GOOS}/${GOARCH}" = "linux/amd64" ]; then
              go test -tags embedrie -run TestEmbeddedPayloadPresent ./internal/rie/
            fi

            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -tags embedrie \
              -ldflags "-s -w -X github.com/open-southeners/lambdary/internal/cli.version=${VERSION}" \
              -o "${outdir}/lambdary" ./cmd/lambdary

            cp README.md CHANGELOG.md "${outdir}/"

            tar -czf "dist/lambdary_${VERSION}_${GOOS}_${GOARCH}.tar.gz" \
              -C "${outdir}" lambdary README.md CHANGELOG.md
          done

          rm -f "${embedded_path}"
          rm -rf "${rie_src}"

          actual_version="$(dist/linux_amd64/lambdary --version)"
          case "${actual_version}" in
            *"${VERSION}"*) ;;
            *)
              echo "::error::linux/amd64 binary reports '${actual_version}', expected it to contain '${VERSION}'"
              exit 1
              ;;
          esac

          (cd dist && sha256sum lambdary_*.tar.gz > checksums.txt)

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
