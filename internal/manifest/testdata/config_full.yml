port: 9000
root: ./functions
defaults:
  runtime: nodejs22.x
  handler: index.handler
  timeout: 15
  memory: 256
  architectures: [arm64]
  layers:
    - arn:aws:lambda:eu-west-1:534081306603:layer:php-83:1
    - ../shared-layer
  environment:
    STAGE: local
  url:
    payload: "1.0"
  local:
    backend: container
    image: my-default-image:latest
    command: /usr/local/bin/node
    env_file: .env.defaults
