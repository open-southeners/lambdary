name: function_a
runtime: nodejs22.x
handler: index.handler
timeout: 30
memory: 512
architectures: [arm64]
layers:
  - arn:aws:lambda:eu-west-1:534081306603:layer:php-83:1
  - ../shared-layer
environment:
  TABLE_NAME: local-table
url:
  path: /function_a
  payload: "2.0"
  invoke_mode: RESPONSE_STREAM
local:
  backend: auto
  image: my-custom-image:latest
  command: /usr/local/bin/node
  env_file: .env
